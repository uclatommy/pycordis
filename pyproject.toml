[project]
name = "pycordis2"
version = "0.0.0"
description = "A Python port of the Cordis core: plugin and service composition from revertible effects."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Thomas Chen" }]
keywords = ["plugin", "dependency-injection", "effects", "hot-reload", "cordis"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Documentation = "https://uclatommy.github.io/pycordis/"
Repository = "https://github.com/uclatommy/pycordis"
Issues = "https://github.com/uclatommy/pycordis/issues"
Upstream = "https://github.com/cordiverse/cordis"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6",
    "ruff>=0.13",
]
docs = [
    "zensical==0.0.46",
    "mkdocstrings[python]>=0.25.0",
    "pymdown-extensions>=10.7",
]

[tool.uv]
default-groups = ["dev", "docs"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pycordis"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "slow: marks tests measured at >=0.1s call time (deselect with '-m \"not slow\"')",
    "upstream(id): the test translates the upstream case with inventory ID id",
    "contract(id): the test checks the semantic-contract property with ID id",
    "divergence(id): the test checks the divergence with ID id",
]

[tool.coverage.run]
source = ["pycordis"]
branch = true
relative_files = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 95
exclude_also = [
    "if TYPE_CHECKING:",
    "^\\s*\\.\\.\\.$",
]
