name: Pages

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.9.3"
          python-version: "3.12"
          enable-cache: true
      - name: Install the project
        run: uv sync --frozen
      - name: Generate the API pages and nav
        run: uv run python scripts/gen_ref_pages.py
      - name: Check for generated drift
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Build the documentation
        run: uv run zensical build --strict
      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
