name: CI

on:
  push:
  pull_request:
    branches: [develop, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.9.3"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install the project
        run: uv sync --frozen
      - name: Run the full test suite
        run: uv run pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.9.3"
          python-version: "3.12"
          enable-cache: true
      - name: Check the lock file
        run: uv lock --check
      - name: Install the project
        run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.9.3"
          python-version: "3.12"
          enable-cache: true
      - name: Install the project
        run: uv sync --frozen
      - name: Generate the API pages and nav
        run: uv run python scripts/gen_ref_pages.py
      - name: Check for generated drift
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Build the documentation
        run: uv run zensical build --strict
