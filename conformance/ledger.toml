# Conformance ledger: the review of each upstream inventory item, plus the contract state.
#
# [contract] lists the contract IDs of docs/architecture.md whose marked test is not
# running yet. The conformance checks reject a pending ID that has a running test, a
# pending ID that is not in the contract table, and a contract ID that is neither
# covered by a running test nor pending.
#
# [inventory] lists the upstream packages other than core that the inventory covers. Core
# is always covered. An ID of another package starts with the package directory:
# `loader/src/config/entry.ts:Entry.update`, `loader/group.spec.ts::Group::title`.
#
# [items."<inventory ID>"] records the review of one upstream item. Add entries for new
# items with `scripts/upstream_inventory.py <clone> --ledger-stubs`, and copy a hash only
# after the review of the upstream item.

[inventory]
packages = ["loader"]

[contract]
pending = []

