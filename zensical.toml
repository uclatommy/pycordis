# ============================================================================
# Zensical documentation configuration for pycordis.
#
# scripts/gen_ref_pages.py rewrites the sections between the API_NAV and
# BUILD_SPECS_NAV markers. Run it before every build:
#   uv run python scripts/gen_ref_pages.py
#   uv run zensical build
# ============================================================================

[project]
site_name = "pycordis"
site_url = "https://uclatommy.github.io/pycordis/"
site_description = "A Python port of the Cordis core: plugin and service composition from revertible effects."
site_author = "Thomas Chen"
repo_url = "https://github.com/uclatommy/pycordis"
docs_dir = "docs"
extra_javascript = [
  "javascripts/mathjax.js",
  "javascripts/vendor/mathjax/tex-svg.js",
]

nav = [
  { Home = "README.md" },
  { "Getting Started" = "getting_started.md" },
  { "User Guide" = "user_guide.md" },
  { "Developer Guide" = "developer_guide.md" },
  { Contributing = "contributing.md" },
  { Architecture = "architecture.md" },
  # API_NAV_START (generated by scripts/gen_ref_pages.py; do not edit)
  { "API Reference" = [
    { "Overview" = "api/index.md" },
    { "Context" = "api/context.md" },
    { "Deferred" = "api/deferred.md" },
    { "Disposables" = "api/disposables.md" },
    { "Errors" = "api/errors.md" },
    { "Events" = "api/events.md" },
    { "Fiber" = "api/fiber.md" },
    { "Hmr" = "api/hmr.md" },
    { "Keys" = "api/keys.md" },
    { "Loader" = "api/loader.md" },
    { "Logger" = "api/logger.md" },
    { "Reflect" = "api/reflect.md" },
    { "Registry" = "api/registry.md" },
    { "Scheduler" = "api/scheduler.md" },
    { "Service" = "api/service.md" },
    { "Timer" = "api/timer.md" },
    { "Traceable" = "api/traceable.md" },
  ]},
  # API_NAV_END
  # BUILD_SPECS_NAV_START (generated by scripts/gen_ref_pages.py; do not edit)
  { "Build Specs" = [
    { "Overview" = "build_specs/index.md" },
    { "Checked Get" = "build_specs/checked_get.md" },
    { "Context Restriction" = "build_specs/context_restriction.md" },
    { "Completed" = [
      { "Conformance" = "build_specs/completed/conformance.md" },
      { "Core Port" = "build_specs/completed/core_port.md" },
      { "Declarative Loader" = "build_specs/completed/declarative_loader.md" },
      { "Module Reload" = "build_specs/completed/module_reload.md" },
      { "Pages And Ci" = "build_specs/completed/pages_and_ci.md" },
      { "Pump Budget" = "build_specs/completed/pump_budget.md" },
      { "Step Reports" = "build_specs/completed/step_reports.md" },
      { "Timer Service" = "build_specs/completed/timer_service.md" },
    ]},
  ]},
  # BUILD_SPECS_NAV_END
]

[project.validation.links]
not_found = "warn"

[project.theme]
name = "material"
features = [
  "navigation.tabs",
  "navigation.sections",
  "toc.follow",
  "search.suggest",
  "search.highlight",
  "content.code.copy",
  "content.code.select",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.plugins.search]

[project.plugins.mkdocstrings]
handlers.python.paths = ["src"]
handlers.python.options.docstring_style = "google"
handlers.python.options.show_source = true
handlers.python.options.show_bases = true
handlers.python.options.show_signature_annotations = true
handlers.python.options.merge_init_into_class = true
handlers.python.options.show_root_toc_entry = false

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
pygments_lang_class = true
[project.markdown_extensions.pymdownx.arithmatex]
generic = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
[project.markdown_extensions.admonition]
[project.markdown_extensions.tables]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
